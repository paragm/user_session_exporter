name: Bug Report
description: Report a bug in the User Session Exporter
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill out the fields below.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: Describe the issue...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to see?
      placeholder: Describe the expected behavior...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Start the exporter with flags ...
        2. Scrape /metrics
        3. See error ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Exporter version
      description: Output of `user_sessions_exporter --version`
      placeholder: "user_sessions_exporter, version 1.3.0 ..."
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      description: Output of `uname -a`
      placeholder: "Linux host01 6.8.0-100-generic ..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Run the exporter with `-log.level=debug` and paste relevant output.
      render: text

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Paste your environment file or relevant flags (redact secrets).
      render: bash
